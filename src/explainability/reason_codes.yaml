# Never disclosed, whatever the model does with them. Age, sex and family
# status are protected or proxy-protected under ECOA; disclosing them as a
# basis for denial is the violation the reason-code layer exists to prevent.
suppress:
  - DAYS_BIRTH
  - STAB_age_years
  - STAB_age_band
  - CODE_GENDER
  - NAME_FAMILY_STATUS
  - CNT_CHILDREN
  - CNT_FAM_MEMBERS
  - RATIO_children_to_family
  - DAYS_ID_PUBLISH
