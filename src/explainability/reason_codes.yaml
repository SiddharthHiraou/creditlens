# ECOA / Regulation B adverse action reason codes.
#
# Under ECOA and Reg B a declined applicant must receive the *specific principal
# reasons* for denial. This file is the versioned mapping from model features to
# the language an applicant actually receives.
#
# Three rules this file encodes, all of them compliance requirements rather than
# modelling preferences:
#
# 1. Reasons are grouped into FAMILIES and deduplicated at family level. Four
#    flavours of "your debt-to-income is high" is one reason, not four, and
#    returning it four times would deprive the applicant of three real reasons.
#
# 2. Features that embed a PROTECTED ATTRIBUTE are never surfaced under their
#    own name. `EXT_mean_x_age` is the model's single strongest feature, but it
#    contains age, which is protected under ECOA. It maps to the external-score
#    family, so the disclosure says what the applicant can act on and never
#    discloses age as a basis for denial.
#
# 3. `suppress: true` features can drive the model but can never appear in a
#    disclosure at all.
#
# version is bumped whenever any phrase changes, because the API logs which
# version produced each memo.

version: 1

families:
  external_score:
    label: Credit bureau score
    phrase: >-
      Credit reporting agency score is below the level required for approval
    actionable: false
  affordability:
    label: Debt-to-income
    phrase: >-
      Proposed monthly payment is high relative to stated income
    actionable: true
  debt_burden:
    label: Existing obligations
    phrase: >-
      Total outstanding debt is high relative to income and available credit
    actionable: true
  bureau_delinquency:
    label: Delinquency on credit file
    phrase: >-
      Credit file shows past-due amounts or accounts reported delinquent
    actionable: true
  repayment_history:
    label: Repayment record
    phrase: >-
      Record of late or partial payments on prior obligations
    actionable: true
  utilisation:
    label: Revolving balances
    phrase: >-
      Revolving account balances are high relative to available credit limits
    actionable: true
  credit_experience:
    label: Credit file depth
    phrase: >-
      Length or depth of established credit history is insufficient
    actionable: false
  employment_stability:
    label: Employment record
    phrase: >-
      Length of employment is shorter than required for approval
    actionable: false
  prior_applications:
    label: Prior application history
    phrase: >-
      Record of recent declined or withdrawn credit applications
    actionable: false
  loan_structure:
    label: Requested terms
    phrase: >-
      Requested amount or term is outside the approved range for this profile
    actionable: true
  residency_region:
    label: Regional risk grade
    phrase: >-
      Application does not meet requirements for the applicable regional grade
    actionable: false

