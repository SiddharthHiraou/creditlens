name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # This project installs from pyproject.toml rather than a uv.lock, so
          # the cache key must point at the file that defines the dependencies.
          # The default glob looks for uv.lock and hard-errors when there is none.
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/python -m ruff check src tests flows
          .venv/bin/python -m ruff format --check src tests flows

      # Artifacts are gitignored, so a clean checkout has no data and no model.
      # The pipeline runs *before* the tests, both because much of the suite
      # scores against real artifacts and because this proves the documented
      # quickstart works from nothing. A reduced Optuna budget keeps it inside a
      # CI runner; the reported numbers come from the full run.
      - name: Build artifacts from scratch
        run: |
          .venv/bin/python -m src.cli data --n 25000
          .venv/bin/python -m src.cli validate
          .venv/bin/python -m src.cli baseline
          .venv/bin/python -m src.cli train --fast --no-mlflow
          .venv/bin/python -m src.cli audit
          .venv/bin/python -m src.cli warm-cache
          .venv/bin/python -m src.api.export_demo

      - name: Test
        run: .venv/bin/python -m pytest tests -q --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Flows and governance docs
        run: |
          .venv/bin/python -m src.cli flows ingest
          .venv/bin/python -m src.cli flows drift
          .venv/bin/python -m src.governance
          .venv/bin/python -m src.features.dictionary

      # The generated governance documents must match the committed ones, or
      # the docs in the repo are describing a model that no longer exists.
      - name: Explain a decline
        run: .venv/bin/python -m src.cli explain

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: infra/terraform

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      # The committed demo snapshots must be enough to build the site. If a
      # page reaches for data the export does not produce, this fails here
      # rather than on the deployed link.
      - name: Build
        run: npm run build
        working-directory: frontend
