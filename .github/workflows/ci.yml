name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src tests

      - name: Test
        run: .venv/bin/python -m pytest tests -q --cov=src --cov-report=term-missing --cov-fail-under=70

      # Proves the documented quickstart actually works on a clean machine.
      - name: Train smoke test
        run: |
          .venv/bin/python -m src.cli data --n 25000
          .venv/bin/python -m src.cli validate
          .venv/bin/python -m src.cli baseline
          .venv/bin/python -m src.cli train --fast --no-mlflow
