server {
    listen 3000;
    # Also bind IPv6: inside the container `localhost` resolves to ::1 first,
    # so an IPv4-only bind makes the healthcheck fail with "connection refused"
    # while the host port works perfectly.
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;

    # Next.js static export writes /page/index.html, so a request for /page
    # must resolve to the directory index.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /404.html;
    }

    # Hashed build assets are immutable; the JSON snapshots are not, so they
    # must not be cached across a redeploy.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
