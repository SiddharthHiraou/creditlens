[project]
name = "creditlens"
version = "0.1.0"
description = "Credit decisioning and model risk platform for consumer lending"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "pyarrow>=18.0",
    "pandera[polars]>=0.22",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
    "joblib>=1.4",
    "lightgbm>=4.7",
    "xgboost>=3.0",
    "catboost>=1.2",
    "optuna>=4.0",
    "mlflow>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "onnxruntime>=1.20",
    "shap>=0.46",
    "fairlearn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "httpx>=0.28",
    "locust>=2.30",
    "onnx>=1.17",
    "skl2onnx>=1.17",
]

[project.scripts]
creditlens = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: marks tests as slow"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in the argument default.
# These are evaluated once at import and are not the mutable-default hazard
# B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# pandera's @pa.check decorator injects a classmethod whose first arg must be
# `cls`; ruff's N805 does not know that.
"src/ingestion/schemas.py" = ["N805"]
